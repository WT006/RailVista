<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Z8991 离线地图</title>
  <style>
:root {
  --top-overlay: 72px;
  --bottom-overlay: 168px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --panel-bg: rgba(15, 23, 42, 0.92);
  --accent: #38bdf8;
  --text-muted: #94a3b8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  touch-action: manipulation;
}

#map {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.top-bar {
  position: fixed;
  top: calc(8px + var(--safe-top));
  left: calc(10px + var(--safe-left));
  right: calc(10px + var(--safe-right));
  z-index: 100;
  pointer-events: none;
}

.top-bar__cluster {
  position: relative;
  pointer-events: auto;
}

.status-card {
  pointer-events: auto;
  background: var(--panel-bg);
  border: 1px solid rgba(148, 163, 184, 0.22);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
}

.status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.status-row--primary {
  font-size: 13px;
  line-height: 1.3;
  margin-bottom: 6px;
}

.status-row--secondary {
  font-size: 12px;
  color: var(--text-muted);
  flex-wrap: wrap;
}

.train-badge {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(56, 189, 248, 0.16);
  color: var(--accent);
  font-weight: 700;
  font-size: 12px;
}

.route-text {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
}

.depart-text {
  flex-shrink: 0;
  padding: 2px 6px;
  margin: 0;
  border: 1px solid rgba(148, 163, 184, 0.25);
  border-radius: 6px;
  background: rgba(15, 23, 42, 0.35);
  color: #cbd5e1;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.depart-text:hover {
  border-color: rgba(56, 189, 248, 0.45);
  color: #e2e8f0;
}

.calibrate-btn {
  flex-shrink: 0;
  padding: 2px 6px;
  margin: 0;
  border: 1px solid rgba(148, 163, 184, 0.25);
  border-radius: 6px;
  background: rgba(15, 23, 42, 0.35);
  color: #cbd5e1;
  font-size: 11px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.calibrate-btn:hover,
.calibrate-btn[aria-expanded="true"] {
  border-color: rgba(34, 197, 94, 0.45);
  color: #bbf7d0;
}

.calibrate-btn.is-active {
  border-color: rgba(34, 197, 94, 0.55);
  background: rgba(34, 197, 94, 0.12);
  color: #86efac;
}

.schedule-dialog {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.schedule-dialog[hidden] {
  display: none;
}

.schedule-dialog__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(2, 6, 23, 0.72);
}

.schedule-dialog__card {
  position: relative;
  width: min(360px, 100%);
  padding: 18px 16px 14px;
  border-radius: 12px;
  background: #0f172a;
  border: 1px solid rgba(148, 163, 184, 0.22);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
}

.schedule-dialog__card h2 {
  margin: 0 0 6px;
  font-size: 17px;
  color: #f1f5f9;
}

.schedule-dialog__hint {
  margin: 0 0 14px;
  font-size: 12px;
  line-height: 1.5;
  color: #94a3b8;
}

.schedule-dialog__field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
  font-size: 13px;
  color: #cbd5e1;
}

.schedule-dialog__field input {
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid rgba(148, 163, 184, 0.35);
  background: #1e293b;
  color: #f8fafc;
  font-size: 15px;
  font-family: inherit;
}

.schedule-dialog__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.schedule-dialog__actions button {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid rgba(148, 163, 184, 0.3);
  background: transparent;
  color: #cbd5e1;
  font-size: 13px;
  cursor: pointer;
}

.schedule-dialog__actions button.primary {
  border-color: rgba(56, 189, 248, 0.5);
  background: rgba(56, 189, 248, 0.15);
  color: #7dd3fc;
  font-weight: 600;
}

.clock {
  flex-shrink: 0;
  margin-left: auto;
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  color: #e2e8f0;
}

.status-divider {
  color: rgba(148, 163, 184, 0.45);
}

#progress-chip strong,
#mode-chip strong {
  color: var(--accent);
}

#mode-chip.warn strong {
  color: #fde68a;
}

.bottom-panel {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 100;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.94), rgba(15, 23, 42, 1));
  border-top: 1px solid rgba(148, 163, 184, 0.2);
  padding: 10px calc(14px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(14px + var(--safe-left));
  box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.25);
}

.location-card {
  margin-bottom: 8px;
}

.location-card__head,
.bottom-panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 4px;
}

.location-card h2,
.bottom-panel h2 {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.02em;
}

.location-mode {
  font-size: 11px;
  color: #86efac;
  background: rgba(34, 197, 94, 0.12);
  border: 1px solid rgba(34, 197, 94, 0.28);
  border-radius: 999px;
  padding: 2px 8px;
  white-space: nowrap;
}

.location-mode.is-schedule {
  color: #fde68a;
  background: rgba(251, 191, 36, 0.12);
  border-color: rgba(251, 191, 36, 0.28);
}

.location-segment {
  font-size: clamp(16px, 4.6vw, 18px);
  font-weight: 700;
  color: #f8fafc;
  line-height: 1.3;
  word-break: break-word;
}

.location-meta {
  margin-top: 2px;
  font-size: 12px;
  color: #cbd5e1;
  line-height: 1.45;
}

.panel-divider {
  height: 1px;
  background: rgba(148, 163, 184, 0.18);
  margin: 8px 0;
}

.upcoming-card .next-name {
  font-size: clamp(18px, 5vw, 22px);
  font-weight: 700;
  color: #f8fafc;
  line-height: 1.25;
  margin-bottom: 4px;
  word-break: break-word;
}

.bottom-panel .meta {
  font-size: 13px;
  color: #cbd5e1;
  line-height: 1.45;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}

.bottom-panel .progress {
  margin-top: 10px;
  height: 5px;
  background: rgba(148, 163, 184, 0.2);
  border-radius: 999px;
  overflow: hidden;
}

.bottom-panel .progress > span {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #0ea5e9, #22d3ee);
  transition: width 0.6s ease;
}

.bottom-panel__progress-text {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.calibrate-popover {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  z-index: 102;
  padding: 10px 12px;
  background: var(--panel-bg);
  border: 1px solid rgba(148, 163, 184, 0.22);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 12px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
}

.calibrate-popover[hidden] {
  display: none !important;
}

.calibrate-popover__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.calibrate-popover__title {
  font-size: 12px;
  font-weight: 700;
}

.calibrate-card__status {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  text-align: right;
}

.calibrate-panel__hint {
  font-size: 11px;
  line-height: 1.45;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.calibrate-stations {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.calibrate-station-btn,
.calibrate-clear,
.info-calibrate-btn,
.map-popup__calibrate {
  border: 1px solid rgba(148, 163, 184, 0.28);
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.45);
  color: #e2e8f0;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.calibrate-station-btn,
.info-calibrate-btn,
.map-popup__calibrate {
  padding: 5px 10px;
}

.calibrate-station-btn.is-active {
  border-color: rgba(34, 197, 94, 0.55);
  background: rgba(34, 197, 94, 0.14);
  color: #86efac;
}

.calibrate-station-btn.is-near {
  border-color: rgba(56, 189, 248, 0.55);
  box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.15);
}

.calibrate-clear {
  margin-top: 8px;
  padding: 5px 12px;
  color: #fca5a5;
  border-color: rgba(248, 113, 113, 0.35);
}

.calibrate-dialog__text {
  white-space: pre-line;
}

.info-calibrate-btn,
.map-popup__calibrate {
  display: inline-block;
  margin-top: 8px;
  border-color: rgba(34, 197, 94, 0.45);
  color: #86efac;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--bottom-overlay) + 56px);
  transform: translateX(-50%);
  z-index: 220;
  max-width: min(92vw, 360px);
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(15, 23, 42, 0.96);
  border: 1px solid rgba(56, 189, 248, 0.35);
  color: #e2e8f0;
  font-size: 13px;
  line-height: 1.45;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  pointer-events: none;
}

.toast[hidden] {
  display: none !important;
}

.map-popup__actions {
  margin-top: 8px;
}

.locate-btn {
  position: fixed;
  right: calc(10px + var(--safe-right));
  bottom: calc(var(--bottom-overlay) + 10px);
  z-index: 101;
  min-width: 44px;
  height: 44px;
  padding: 0 12px;
  border: 1px solid rgba(34, 197, 94, 0.35);
  border-radius: 999px;
  background: var(--panel-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #86efac;
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
}

.legend-toggle {
  position: fixed;
  right: calc(10px + var(--safe-right));
  bottom: calc(var(--bottom-overlay) + 62px);
  z-index: 101;
  min-width: 44px;
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid rgba(148, 163, 184, 0.25);
  border-radius: 999px;
  background: var(--panel-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #e2e8f0;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
}

.legend {
  position: fixed;
  right: calc(10px + var(--safe-right));
  bottom: calc(var(--bottom-overlay) + 114px);
  z-index: 101;
  display: none;
  background: var(--panel-bg);
  border: 1px solid rgba(148, 163, 184, 0.25);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.9;
  color: #cbd5e1;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
}

.legend.is-open {
  display: block;
}

.legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}

.legend-item--toggle {
  display: block;
  width: 100%;
  margin: 0;
  padding: 0;
  border: none;
  background: transparent;
  color: inherit;
  font: inherit;
  line-height: inherit;
  text-align: left;
  cursor: pointer;
  border-radius: 6px;
  transition: opacity 0.15s ease, background 0.15s ease;
}

.legend-item--toggle:hover {
  background: rgba(148, 163, 184, 0.12);
}

.legend-item--toggle[aria-pressed="false"] {
  opacity: 0.5;
}

.legend-item--toggle[aria-pressed="false"] .train,
.legend-item--toggle[aria-pressed="false"] .spot,
.legend-item--toggle[aria-pressed="false"] .gps {
  background: #64748b;
}

.legend-item--toggle[aria-pressed="false"] .rail {
  background: #64748b;
}

.legend-item--toggle[aria-pressed="false"] .station {
  background: #64748b;
  border-color: #64748b;
}

.legend .rail {
  background: #38bdf8;
  border-radius: 2px;
  height: 3px;
  width: 14px;
}

.legend .spot {
  background: #f97316;
}

.legend .station {
  background: #facc15;
  border: 1px solid #fff;
}

.legend .train {
  background: #22c55e;
}

.legend .gps {
  background: #60a5fa;
  border: 1px solid #fff;
}

.station-marker {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.station-marker--compact .station-label {
  display: none;
}

.station-dot {
  width: 12px;
  height: 12px;
  background: #facc15;
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.35);
}

.station-marker--compact .station-dot {
  width: 10px;
  height: 10px;
}

.spot-marker {
  background: #f97316;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 999px;
  border: 2px solid #fff;
  white-space: nowrap;
  line-height: 1.2;
}

.spot-marker--compact {
  font-size: 9px;
  padding: 1px 5px;
  border-width: 1.5px;
}

.train-marker {
  position: relative;
  width: 16px;
  height: 16px;
  background: #22c55e;
  border: 3px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.25);
  animation: train-pulse 2s ease-in-out infinite;
}

.train-marker::after {
  content: '';
  position: absolute;
  inset: -8px;
  border: 2px solid rgba(34, 197, 94, 0.45);
  border-radius: 50%;
  animation: train-ring 2s ease-out infinite;
}

.train-marker-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.train-marker-label {
  margin-top: 4px;
  padding: 2px 6px;
  font-size: 10px;
  font-weight: 700;
  color: #dcfce7;
  background: rgba(15, 23, 42, 0.88);
  border: 1px solid rgba(34, 197, 94, 0.35);
  border-radius: 4px;
  white-space: nowrap;
}

.train-marker--compact .train-marker-label {
  display: none;
}

.gps-marker {
  width: 14px;
  height: 14px;
  background: #60a5fa;
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.28);
}

@keyframes train-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

@keyframes train-ring {
  0% { transform: scale(0.8); opacity: 0.8; }
  100% { transform: scale(1.6); opacity: 0; }
}

.train-marker--compact {
  width: 14px;
  height: 14px;
  border-width: 2px;
  box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.25);
}

.error-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: calc(20px + var(--safe-top)) calc(20px + var(--safe-right)) calc(20px + var(--safe-bottom)) calc(20px + var(--safe-left));
  background: rgba(15, 23, 42, 0.92);
}

.error-overlay.show {
  display: flex;
}

.error-card {
  width: min(420px, 100%);
  background: #1e293b;
  border: 1px solid rgba(148, 163, 184, 0.25);
  border-radius: 16px;
  padding: 20px;
}

.error-card h1 {
  font-size: 18px;
  margin-bottom: 8px;
}

.error-card p {
  font-size: 14px;
  line-height: 1.6;
  color: #cbd5e1;
}

.error-card code {
  background: #0f172a;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
}

.station-label {
  margin-top: 2px;
  padding: 1px 5px;
  font-size: 10px;
  line-height: 1.3;
  color: #fef9c3;
  background: rgba(15, 23, 42, 0.82);
  border: 1px solid rgba(250, 204, 21, 0.35);
  border-radius: 4px;
  white-space: nowrap;
}

@media (min-width: 641px) {
  :root {
    --top-overlay: 88px;
    --bottom-overlay: 156px;
  }

  .top-bar {
    top: calc(12px + var(--safe-top));
    left: calc(12px + var(--safe-left));
    right: auto;
    max-width: 520px;
  }

  .status-card {
    padding: 12px 14px;
  }

  .status-row--primary {
    font-size: 14px;
  }

  .depart-text {
    font-size: 12px;
  }

  .legend-toggle {
    display: none;
  }

  .legend {
    display: block;
    bottom: calc(var(--bottom-overlay) + 12px);
  }

  .bottom-panel .meta {
    -webkit-line-clamp: 3;
  }
}

@media (max-width: 380px) {
  .depart-text,
  .calibrate-btn {
    font-size: 10px;
    padding: 2px 5px;
  }

  .status-row--primary {
    gap: 6px;
  }
}

html,
body {
  min-height: 100%;
  min-height: 100dvh;
}

.map-shell {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  min-height: -webkit-fill-available;
  background:
    radial-gradient(circle at 20% 15%, rgba(56, 189, 248, 0.08), transparent 42%),
    radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.06), transparent 40%),
    #0b1220;
}

#route-svg {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}

#route-svg.is-dragging {
  cursor: grabbing;
}

.spot-node,
.station-node,
#train-marker {
  cursor: pointer;
}

.map-popup {
  position: absolute;
  z-index: 50;
  transform: translate(-50%, calc(-100% - 14px));
  max-width: min(280px, 78vw);
  padding: 10px 28px 10px 12px;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(15, 23, 42, 0.28);
  font-size: 14px;
  line-height: 1.55;
  color: #334155;
  pointer-events: auto;
}

.map-popup[hidden] {
  display: none;
}

.map-popup__title {
  font-weight: 700;
  color: #0f172a;
  margin-bottom: 2px;
}

.map-popup__subtitle {
  color: #334155;
  margin-bottom: 4px;
}

.map-popup__subtitle:empty,
.map-popup__detail:empty {
  display: none;
}

.map-popup__detail {
  color: #64748b;
  font-size: 13px;
}

.map-popup__close {
  position: absolute;
  top: 4px;
  right: 6px;
  width: 24px;
  height: 24px;
  padding: 0;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: #94a3b8;
  font-size: 18px;

  <script>
(function () {
  const STORAGE_KEY = 'z8991_departure';
  const CALIBRATION_STORAGE_KEY = 'z8991_station_calibration';
  const TRAIN_MARKER_KEY = 'z8991_show_train_marker';
  const LAYER_VISIBILITY_KEY = 'z8991_layer_visibility';
  const CALIBRATE_WINDOW_MS = 45 * 60 * 1000;
  const DEFAULT_LAYER_VISIBILITY = {
    rail: true,
    station: true,
    spot: true,
    train: true,
    gps: true,
  };

  function shiftDate(value, offsetMs) {
    const date = value instanceof Date ? value : new Date(value);
    return new Date(date.getTime() + offsetMs);
  }

  function getDepartureIso(data, config, searchParams) {
    const params = searchParams || new URLSearchParams(window.location.search);
    let stored = null;
    try {
      stored = localStorage.getItem(STORAGE_KEY);
    } catch (_) {
      /* private mode */
    }
    return params.get('departure') || stored || config?.DEPARTURE || data.stations[0].at;
  }

  /**
   * 解析发车/到达。修改发车时间会将 data.js 中全部站时刻与风景点时刻整体平移相同偏移。
   * 优先级：URL ?departure= > localStorage > config.js > data.js 默认
   */
  function resolveSchedule(data, config, searchParams) {
    const params = searchParams || new URLSearchParams(window.location.search);
    const cfg = config || {};
    const baseDeparture = new Date(data.stations[0].at);
    const baseArrival = new Date(data.stations[data.stations.length - 1].at);

    const departureValue = getDepartureIso(data, cfg, params);
    const departure = new Date(departureValue);
    const offsetMs = departure.getTime() - baseDeparture.getTime();

    const arrivalValue = params.get('arrival') || cfg.ARRIVAL || null;
    const arrival = arrivalValue ? new Date(arrivalValue) : shiftDate(baseArrival, offsetMs);

    return { departure, arrival, offsetMs, baseDeparture, baseArrival };
  }

  function toDatetimeLocalValue(isoOrDate) {
    const date = isoOrDate instanceof Date ? isoOrDate : new Date(isoOrDate);
    const s = date.toLocaleString('sv-SE', { timeZone: 'Asia/Shanghai' });
    return s.slice(0, 16).replace(' ', 'T');
  }

  function fromDatetimeLocalValue(value) {
    if (!value) return null;
    return `${value}:00+08:00`;
  }

  function setDepartureIso(iso) {
    localStorage.setItem(STORAGE_KEY, iso);
  }

  function clearDeparture() {
    localStorage.removeItem(STORAGE_KEY);
  }

  function readCalibration() {
    try {
      const raw = localStorage.getItem(CALIBRATION_STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (typeof parsed.offsetMs !== 'number' || !parsed.stationName) return null;
      return parsed;
    } catch (_) {
      return null;
    }
  }

  function writeCalibration(record) {
    try {
      localStorage.setItem(CALIBRATION_STORAGE_KEY, JSON.stringify(record));
    } catch (_) {
      /* private mode */
    }
    return record;
  }

  function clearCalibration() {
    try {
      localStorage.removeItem(CALIBRATION_STORAGE_KEY);
    } catch (_) {
      /* private mode */
    }
  }

  /** 中间经停站（不含始发西宁、终到拉萨） */
  function getCalibratableStations(stations) {
    return stations.filter((s) => s.type === 'stop');
  }

  function getStationAnchorTime(station, shifted) {
    if (station.type !== 'stop' || !station.arrive) return null;
    return shifted(station.arrive);
  }

  function computeCalibrationOffset(now, anchorTime) {
    return now.getTime() - anchorTime.getTime();
  }

  /** 将真实时间映射回图定时刻轴，后续进度与 ETA 均基于此 */
  function effectiveScheduleDate(now, calibration) {
    if (!calibration || typeof calibration.offsetMs !== 'number') {
      return now instanceof Date ? now : new Date(now);
    }
    const base = now instanceof Date ? now : new Date(now);
    return new Date(base.getTime() - calibration.offsetMs);
  }

  function formatOffsetLabel(offsetMs) {
    const min = Math.round(offsetMs / 60000);
    if (min === 0) return '准点';
    if (min > 0) return `晚点 ${min} 分钟`;
    return `早点 ${Math.abs(min)} 分钟`;
  }

  function isNearScheduledArrival(now, station, shifted, windowMs = CALIBRATE_WINDOW_MS) {
    const anchor = getStationAnchorTime(station, shifted);
    if (!anchor) return false;
    return Math.abs(now.getTime() - anchor.getTime()) <= windowMs;
  }

  function buildCalibrationPreview(station, now, shifted, stations, currentCalibration) {
    const anchorTime = getStationAnchorTime(station, shifted);
    if (!anchorTime) {
      return { ok: false, reason: '该站不支持校准' };
    }
    const offsetMs = computeCalibrationOffset(now, anchorTime);
    const deltaMin = Math.round(offsetMs / 60000);
    let backward = false;
    if (currentCalibration) {
      const lastIdx = stations.findIndex((s) => s.name === currentCalibration.stationName);
      const newIdx = stations.findIndex((s) => s.name === station.name);
      backward = lastIdx >= 0 && newIdx >= 0 && newIdx < lastIdx;
    }
    return {
      ok: true,
      offsetMs,
      deltaMin,
      anchorTime,
      backward,
      shiftLabel: deltaMin >= 0 ? '延后' : '提前',
      shiftMin: Math.abs(deltaMin),
    };
  }

  function calibrateAtStation(station, now, shifted) {
    const anchorTime = getStationAnchorTime(station, shifted);
    if (!anchorTime) return null;
    return writeCalibration({
      stationName: station.name,
      offsetMs: computeCalibrationOffset(now, anchorTime),
      calibratedAt: now.toISOString(),
      anchorIso: anchorTime.toISOString(),
    });
  }

  function showToast(el, message, durationMs = 2800) {
    if (!el) return;
    el.textContent = message;
    el.hidden = false;
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => {
      el.hidden = true;
    }, durationMs);
  }

  function bindStationCalibration({
    data,
    shifted,
    getNow,
    getCalibration,
    onApply,
    onClear,
    elements,
  }) {
    const {
      toggle,
      panel,
      list,
      status,
      clearBtn,
      dialog,
      dialogText,
      dialogConfirm,
      dialogCancel,
      toast,
    } = elements;
    if (!list || !dialog) return { refresh: () => {} };

    const backdrop = dialog.querySelector('.schedule-dialog__backdrop');
    let pendingStation = null;

    const closeDialog = () => {
      pendingStation = null;
      dialog.hidden = true;
    };

    const renderList = () => {
      const cal = getCalibration();
      const now = getNow();
      list.innerHTML = '';
      getCalibratableStations(data.stations).forEach((station) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'calibrate-station-btn';
        btn.textContent = station.name;
        if (cal?.stationName === station.name) btn.classList.add('is-active');
        if (isNearScheduledArrival(now, station, shifted)) btn.classList.add('is-near');
        btn.addEventListener('click', () => {
          pendingStation = station;
          const preview = buildCalibrationPreview(
            station,
            now,
            shifted,
            data.stations,
            cal
          );
          if (!preview.ok) {
            showToast(toast, preview.reason || '无法校准');
            return;
          }
          const backwardNote = preview.backward
            ? `\n\n注意：当前已按「${cal.stationName}」校准，改到更早的站会覆盖后续估算。`
            : '';
          dialogText.textContent =
            `确认您现在在「${station.name}」？\n` +
            `图定到点 ${formatTime(preview.anchorTime)}，当前 ${formatTime(now)}（${formatOffsetLabel(preview.offsetMs)}）。\n` +
            `确认后，后续风景点与进度估算将整体${preview.shiftLabel} ${preview.shiftMin} 分钟。${backwardNote}`;
          dialog.hidden = false;
        });
        list.appendChild(btn);
      });
    };

    const updateStatus = () => {
      const cal = getCalibration();
      if (status) {
        status.textContent = cal
          ? `已校准·${cal.stationName}（${formatOffsetLabel(cal.offsetMs)}）`
          : '未校准';
      }
      if (toggle) {
        toggle.classList.toggle('is-active', !!cal);
        toggle.title = cal
          ? `站点校准：${cal.stationName}（${formatOffsetLabel(cal.offsetMs)}）`
          : '站点校准';
      }
      if (clearBtn) clearBtn.hidden = !cal;
    };

    const closePanel = () => {
      if (!panel) return;
      panel.hidden = true;
      toggle?.setAttribute('aria-expanded', 'false');
    };

    const refresh = () => {
      updateStatus();
      if (panel && !panel.hidden) renderList();
    };

    toggle?.addEventListener('click', (event) => {
      event.stopPropagation();
      const open = panel.hidden;
      panel.hidden = !open;
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) refresh();
    });

    document.addEventListener('click', (event) => {
      if (!panel || panel.hidden) return;
      if (panel.contains(event.target) || toggle?.contains(event.target)) return;
      closePanel();
    });

    clearBtn?.addEventListener('click', () => {
      clearCalibration();
      onClear?.();
      refresh();
      showToast(toast, '已清除站点校准');
    });

    dialogCancel?.addEventListener('click', closeDialog);
    backdrop?.addEventListener('click', closeDialog);

    dialogConfirm?.addEventListener('click', () => {
      if (!pendingStation) return;
      const record = calibrateAtStation(pendingStation, getNow(), shifted);
      closeDialog();
      if (record) {
        onApply?.(record);
        closePanel();
        refresh();
        showToast(toast, `已按「${record.stationName}」校准，后续估算已${formatOffsetLabel(record.offsetMs)}`);
      }
    });

    refresh();
    return { refresh, openConfirmForStation: (station) => {
      pendingStation = station;
      const preview = buildCalibrationPreview(
        station,
        getNow(),
        shifted,
        data.stations,
        getCalibration()
      );
      if (!preview.ok) {
        showToast(toast, preview.reason || '无法校准');
        return;
      }
      dialogText.textContent =
        `确认您现在在「${station.name}」？\n` +
        `图定到点 ${formatTime(preview.anchorTime)}，当前 ${formatTime(getNow())}（${formatOffsetLabel(preview.offsetMs)}）。\n` +
        `确认后，后续风景点与进度估算将整体${preview.shiftLabel} ${preview.shiftMin} 分钟。`;
      dialog.hidden = false;
    } };
  }

  function isShowTrainMarker() {
    return isLayerVisible('train');
  }

  function setShowTrainMarker(show) {
    setLayerVisible('train', show);
  }

  function readStoredLayers() {
    try {
      const raw = localStorage.getItem(LAYER_VISIBILITY_KEY);
      if (raw) {
        return { ...DEFAULT_LAYER_VISIBILITY, ...JSON.parse(raw) };
      }
      const legacyTrain = localStorage.getItem(TRAIN_MARKER_KEY);
      if (legacyTrain !== null) {
        return { ...DEFAULT_LAYER_VISIBILITY, train: legacyTrain !== '0' };
      }
    } catch (_) {
      /* private mode / invalid JSON */
    }
    return { ...DEFAULT_LAYER_VISIBILITY };
  }

  function getLayerVisibility() {
    return readStoredLayers();
  }

  function setLayerVisible(layer, show) {
    const next = { ...readStoredLayers(), [layer]: !!show };
    try {
      localStorage.setItem(LAYER_VISIBILITY_KEY, JSON.stringify(next));
    } catch (_) {
      /* private mode */
    }
    return next;
  }

  function isLayerVisible(layer) {
    return readStoredLayers()[layer] !== false;
  }

  function formatDepartBadge(date) {
    const parts = Object.fromEntries(
      new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }).formatToParts(date).map((part) => [part.type, part.value])
    );
    return `${parts.month}/${parts.day} ${parts.hour}:${parts.minute}`;
  }

  function formatDepartLong(date) {
    const parts = Object.fromEntries(
      new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }).formatToParts(date).map((part) => [part.type, part.value])
    );
    return `${parts.month}月${parts.day}日 ${parts.hour}:${parts.minute}`;
  }

  function formatTime(date) {
    return date.toLocaleTimeString('zh-CN', {
      timeZone: 'Asia/Shanghai',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false,
    });
  }

  function formatSpotTimeLabel(spot, shiftedStart) {
    const start = shiftedStart instanceof Date ? shiftedStart : new Date(shiftedStart);
    const m = spot.timeLabel && spot.timeLabel.match(/(\d{1,2}:\d{2})\s*[～~]\s*(\d{1,2}:\d{2})/);
    if (!m) return formatTime(start);
    const [sh, sm] = m[1].split(':').map(Number);
    const [eh, em] = m[2].split(':').map(Number);
    let durMin = (eh * 60 + em) - (sh * 60 + sm);
    if (durMin < 0) durMin += 24 * 60;
    const end = new Date(start.getTime() + durMin * 60000);
    return `${formatTime(start)}～${formatTime(end)}`;
  }

  function formatStationSchedule(station, shifted) {
    if (station.type === 'depart') {
      return `开点 ${formatTime(shifted(station.at))} · 始发`;
    }
    if (station.type === 'arrive') {
      return `到点 ${formatTime(shifted(station.at))} · 终到`;
    }
    const arr = formatTime(shifted(station.arrive));
    const dep = formatTime(shifted(station.depart));
    return `到 ${arr} · 开 ${dep}`;
  }

  function updateDepartBadge(departure) {
    const btn = document.getElementById('depart-btn');
    if (btn) btn.textContent = formatDepartBadge(departure);
  }

  function bindDepartureEditor({ data, config, getSchedule, onApply }) {
    const btn = document.getElementById('depart-btn');
    const dialog = document.getElementById('schedule-dialog');
    if (!btn || !dialog) return;

    const input = document.getElementById('departure-input');
    const saveBtn = document.getElementById('departure-save');
    const cancelBtn = document.getElementById('departure-cancel');
    const resetBtn = document.getElementById('departure-reset');
    const backdrop = dialog.querySelector('.schedule-dialog__backdrop');

    const openDialog = () => {
      const current = getSchedule();
      if (input) input.value = toDatetimeLocalValue(current.departure);
      dialog.hidden = false;
    };

    const closeDialog = () => {
      dialog.hidden = true;
    };

    btn.addEventListener('click', openDialog);
    cancelBtn?.addEventListener('click', closeDialog);
    backdrop?.addEventListener('click', closeDialog);

    resetBtn?.addEventListener('click', () => {
      clearDeparture();
      clearCalibration();
      onApply(resolveSchedule(data, config));
      closeDialog();
    });

    saveBtn?.addEventListener('click', () => {
      const iso = fromDatetimeLocalValue(input?.value);
      if (!iso || Number.isNaN(new Date(iso).getTime())) return;
      setDepartureIso(iso);
      clearCalibration();
      const nextConfig = { ...(config || {}), DEPARTURE: iso };
      onApply(resolveSchedule(data, nextConfig));
      closeDialog();
    });
  }

  window.Z8991Schedule = {
    STORAGE_KEY,
    CALIBRATION_STORAGE_KEY,
    CALIBRATE_WINDOW_MS,
    shiftDate,
    getDepartureIso,
    resolveSchedule,
    setDepartureIso,
    clearDeparture,
    readCalibration,
    writeCalibration,
    clearCalibration,
    getCalibratableStations,
    getStationAnchorTime,
    computeCalibrationOffset,
    effectiveScheduleDate,
    formatOffsetLabel,
    isNearScheduledArrival,
    buildCalibrationPreview,
    calibrateAtStation,
    showToast,
    bindStationCalibration,
    isShowTrainMarker,
    setShowTrainMarker,
    getLayerVisibility,
    setLayerVisible,
    isLayerVisible,
    toDatetimeLocalValue,
    fromDatetimeLocalValue,
    formatDepartBadge,
    formatDepartLong,
    formatTime,
    formatSpotTimeLabel,
    formatStationSchedule,
    updateDepartBadge,
    bindDepartureEditor,
    TRAIN_MARKER_KEY,
    LAYER_VISIBILITY_KEY,
    DEFAULT_LAYER_VISIBILITY,
  };
})();

  </script>
  <script>
(function () {
  const config = window.Z8991_CONFIG || {};
  const data = window.Z8991_DATA || {};
  const scheduleApi = window.Z8991Schedule;

  let scheduleState = scheduleApi.resolveSchedule(data, config);
  let departure = scheduleState.departure;
  let arrival = scheduleState.arrival;
  let offsetMs = scheduleState.offsetMs;
  const shifted = (value) => scheduleApi.shiftDate(value, offsetMs);
  let calibration = scheduleApi.readCalibration();
  let calibrationUi = null;

  let railwayPath = [];
  let railwayLength = 0;
  let stationDistances = [];
  let gpsAvailable = false;
  let lastGpsAt = 0;
  let lastGps = null;
  let lastTrainPoint = null;
  let lastMode = '时刻表估算';
  let currentProgress = 0;
  let isCompact = false;
  let layerVisibility = scheduleApi.getLayerVisibility();

  let svg;
  let viewport;
  let trainEl;
  let gpsEl;
  let railLayerEl;
  let spotLayerEl;
  let stationLayerEl;
  let mapPopupEl = null;
  let mapPopupAnchor = null;
  let suppressMapClick = false;
  let viewBox = { x: 0, y: 0, w: 1000, h: 700 };
  let baseViewBox = null;
  let projectFn = null;

  const els = {
    mode: document.getElementById('mode-chip'),

    progressChip: document.getElementById('progress-chip'),
    bottomProgress: document.getElementById('bottom-progress-text'),
    nextTitle: document.getElementById('next-title'),

    progressBar: document.getElementById('progress-bar'),

    locateBtn: document.getElementById('locate-btn'),
    locationSegment: document.getElementById('location-segment'),
    locationMeta: document.getElementById('location-meta'),
    locationMode: document.getElementById('location-mode'),
  };

  function applySchedule(next) {
    scheduleState = next;
    departure = next.departure;

  }

  function applyCalibration(record) {

    tick(lastGps && gpsAvailable ? lastGps : null);
  }

  function clearCalibrationState() {

    tick(lastGps && gpsAvailable ? lastGps : null);
  }

  function getNow() {
    const mock = new URLSearchParams(window.location.search).get('mockNow');
    if (mock) {
      const parsed = new Date(mock);
      if (!Number.isNaN(parsed.getTime())) return parsed;
    }
    return new Date();
  }

  function getEffectiveNow(now) {
    return scheduleApi.effectiveScheduleDate(now, calibration);
  }

  function getSpotTimeLabel(spot) {
    return scheduleApi.formatSpotTimeLabel(spot, shifted(spot.at));
  }

  function isMobileLayout() {
    return window.matchMedia('(max-width: 640px)').matches;
  }

  function shortModeLabel(mode) {
    if (!isCompact) return mode;
    return mode
      .replace('时刻表估算（已校准·GPS 弱）', '时刻表（已校准）')
      .replace('时刻表估算（已校准·偏离）', '时刻表（已校准）')
      .replace('时刻表估算（已校准）', '时刻表（已校准）')
      .replace('时刻表估算（GPS 信号弱）', '时刻表（GPS弱）')
      .replace('时刻表估算（偏离铁路较远）', '时刻表（偏离）')
      .replace('时刻表估算', '时刻表')
      .replace('GPS + 时刻表（已校准）', 'GPS（已校准）')
      .replace('GPS + 时刻表', 'GPS');
  }

  function getRailwayCoords() {
    const precise = window.Z8991_RAILWAY;
    if (precise && precise.length > 2) return precise;
    return data.railway || [];
  }

  function haversineKm(a, b) {
    const toRad = (d) => (d * Math.PI) / 180;
    const dLat = toRad(b.lat - a.lat);
    const dLng = toRad(b.lng - a.lng);
    const lat1 = toRad(a.lat);
    const lat2 = toRad(b.lat);
    const h =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
    return 6371 * 2 * Math.asin(Math.sqrt(h));
  }

  function buildRailwayMetrics() {
    railwayPath = getRailwayCoords().map(([lng, lat], index) => ({
      lng, lat, index, distFromStart: 0,
    }));
    railwayLength = 0;
    for (let i = 1; i < railwayPath.length; i += 1) {
      railwayLength += haversineKm(railwayPath[i - 1], railwayPath[i]);
      railwayPath[i].distFromStart = railwayLength;
    }
  }

  function buildStationDistances() {
    stationDistances = data.stations.map((station) => {
      const projected = projectToRailway(station.lng, station.lat);
      return {
        ...station,
        progress: projected.progress,
        distKm: projected.progress * railwayLength,
      };
    });
  }

  function interpolatePoint(a, b, t) {
    return {
      lng: a.lng + (b.lng - a.lng) * t,
      lat: a.lat + (b.lat - a.lat) * t,
    };
  }

  function pointAtProgress(progress) {
    const clamped = Math.max(0, Math.min(1, progress));
    const target = clamped * railwayLength;
    for (let i = 1; i < railwayPath.length; i += 1) {
      if (railwayPath[i].distFromStart >= target) {
        const prev = railwayPath[i - 1];
        const curr = railwayPath[i];
        const segLen = curr.distFromStart - prev.distFromStart || 1;
        const t = (target - prev.distFromStart) / segLen;
        return interpolatePoint(prev, curr, t);
      }
    }
    const last = railwayPath[railwayPath.length - 1];
    return { lng: last.lng, lat: last.lat };
  }

  function projectToRailway(lng, lat) {
    let best = { distKm: Infinity, progress: 0, point: railwayPath[0] };
    for (let i = 1; i < railwayPath.length; i += 1) {
      const a = railwayPath[i - 1];
      const b = railwayPath[i];
      const segLen = b.distFromStart - a.distFromStart || 1;
      const dx = b.lng - a.lng;
      const dy = b.lat - a.lat;
      const t = Math.max(
        0,
        Math.min(1, ((lng - a.lng) * dx + (lat - a.lat) * dy) / (dx * dx + dy * dy || 1))
      );
      const point = interpolatePoint(a, b, t);
      const distKm = haversineKm({ lng, lat }, point);
      const progress = (a.distFromStart + segLen * t) / railwayLength;
      if (distKm < best.distKm) best = { distKm, progress, point };
    }
    return best;
  }

  function scheduleProgress(now) {
    const timeline = [];
    data.stations.forEach((s) => {
      if (s.at) timeline.push({ at: shifted(s.at), name: s.name });
      if (s.arrive) timeline.push({ at: shifted(s.arrive), name: `${s.name}（到）` });
      if (s.depart) timeline.push({ at: shifted(s.depart), name: `${s.name}（开）` });
    });
    timeline.sort((a, b) => a.at - b.at);
    if (now <= departure) return 0;
    if (now >= arrival) return 1;

    for (let i = 0; i < timeline.length - 1; i += 1) {
      const cur = timeline[i];
      const next = timeline[i + 1];
      if (now >= cur.at && now <= next.at) {
        const span = next.at - cur.at || 1;
        const localT = (now - cur.at) / span;
        const idxA = data.stations.findIndex((s) => cur.name.startsWith(s.name));
        const idxB = data.stations.findIndex((s) => next.name.startsWith(s.name));
        const a = idxA >= 0 ? idxA / (data.stations.length - 1) : i / (timeline.length - 1);
        const b = idxB >= 0 ? idxB / (data.stations.length - 1) : (i + 1) / (timeline.length - 1);
        return a + (b - a) * localT;
      }
    }
    return (now - departure) / (arrival - departure);
  }

  function getSimulatedProgress() {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('progress') ?? params.get('simulate');
    if (raw == null) return null;
    const value = Number(raw);
    if (Number.isNaN(value)) return null;
    return value > 1 ? value / 100 : value;
  }

  function resolveProgress(now, gps) {
    const simulated = getSimulatedProgress();
    if (simulated != null) {
      return { progress: Math.max(0, Math.min(1, simulated)), mode: '模拟进度' };
    }

    const effectiveNow = getEffectiveNow(now);
    const scheduleP = scheduleProgress(effectiveNow);
    const calibrated = !!calibration;
    const scheduleMode = calibrated ? '时刻表估算（已校准）' : '时刻表估算';

    if (!gps) return { progress: scheduleP, mode: scheduleMode };

    const ageMs = now.getTime() - gps.timestamp;
    if (ageMs > 120000 || gps.accuracy > 800) {
      return { progress: scheduleP, mode: calibrated ? '时刻表估算（已校准·GPS 弱）' : '时刻表估算（GPS 信号弱）' };
    }

    const projected = projectToRailway(gps.lng, gps.lat);
    if (projected.distKm > 8) {
      return { progress: scheduleP, mode: calibrated ? '时刻表估算（已校准·偏离）' : '时刻表估算（偏离铁路较远）' };
    }

    return {
      progress: projected.progress * 0.65 + scheduleP * 0.35,
      mode: calibrated ? 'GPS + 时刻表（已校准）' : 'GPS + 时刻表',
    };
  }

  function formatClock(now) {
    const opts = {
      timeZone: 'Asia/Shanghai',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false,
    };
    if (isCompact) return now.toLocaleTimeString('zh-CN', opts);
    return now.toLocaleString('zh-CN', {
      ...opts,
      month: 'numeric',
      day: 'numeric',
    });
  }

  function formatEta(targetDate, referenceNow) {
    const ref = referenceNow || new Date();
    const diffMin = Math.round((targetDate - ref) / 60000);
    if (diffMin <= 0) return '即将经过或已通过';
    if (diffMin < 60) return `约 ${diffMin} 分钟后`;
    const h = Math.floor(diffMin / 60);
    const m = diffMin % 60;
    return `约 ${h} 小时 ${m} 分钟后`;
  }

  function getUpcomingSpot(now, progress) {
    const effectiveNow = getEffectiveNow(now);
    const spots = [...data.scenicSpots].sort((a, b) => shifted(a.at) - shifted(b.at));

    if (progress <= 0 && now < departure) {
      const firstSpot = spots[0];
      return {
        spot: firstSpot,
        reason: `${scheduleApi.formatDepartLong(departure)} 发车 · 首个计划风景点`,
      };
    }

    const upcomingByTime = spots.find((s) => shifted(s.at) >= effectiveNow);
    if (upcomingByTime) {
      return { spot: upcomingByTime, reason: formatEta(shifted(upcomingByTime.at), effectiveNow) };
    }

    const currentPoint = pointAtProgress(progress);
    let best = null;
    spots.forEach((spot) => {
      const dist = haversineKm(currentPoint, spot);
      if (dist > 0.5 && dist < 80 && (!best || dist < best.dist)) {
        best = { spot, dist };
      }
    });
    if (best) {
      return { spot: best.spot, reason: `距当前位置约 ${best.dist.toFixed(0)} 公里` };
    }

    return {
      spot: { name: '拉萨', timeLabel: `${scheduleApi.formatTime(arrival)} 到达`, intro: '青藏铁路南端终点，天路旅程的标志性终点。' },
      reason: '行程即将结束',
    };
  }

  function getCurrentLocationInfo(progress, mode) {
    const traveledKm = progress * railwayLength;
    const remainKm = Math.max(0, railwayLength - traveledKm);
    const pct = Math.round(progress * 100);

    if (progress <= 0) {
      let meta = `${scheduleApi.formatDepartLong(departure)} 发车前 · 全程约 ${Math.round(railwayLength)} 公里`;
      if (lastGps && gpsAvailable) {
        const proj = projectToRailway(lastGps.lng, lastGps.lat);
        if (proj.distKm > 8) {
          meta += ` · 您的 GPS 距铁路约 ${Math.round(proj.distKm)} km（未在车上）`;
        } else {
          meta += ` · GPS 已在铁路附近`;
        }
      } else if (!gpsAvailable) {
        meta += ' · 未获取 GPS，按时刻表';
      }
      return {
        segment: '西宁站 · 尚未发车',
        meta,
        modeLabel: shortModeLabel(mode),
        isSchedule: mode.includes('时刻表') || mode.includes('模拟'),
      };
    }
    if (progress >= 1) {
      return {
        segment: '拉萨站 · 已到达',
        meta: `全程 ${Math.round(railwayLength)} 公里 · 进度 100%`,
        modeLabel: shortModeLabel(mode),
        isSchedule: mode.includes('时刻表') || mode.includes('模拟'),
      };
    }

    let from = stationDistances[0];
    let to = stationDistances[stationDistances.length - 1];
    for (let i = 0; i < stationDistances.length - 1; i += 1) {
      if (traveledKm >= stationDistances[i].distKm && traveledKm <= stationDistances[i + 1].distKm) {
        from = stationDistances[i];
        to = stationDistances[i + 1];
        break;
      }
    }

    const segSpan = Math.max(to.distKm - from.distKm, 1);
    const segPct = Math.round(((traveledKm - from.distKm) / segSpan) * 100);
    const gpsNote = lastGps && mode.includes('GPS')
      ? ` · GPS 精度 ±${Math.round(lastGps.accuracy)}m`
      : '';

    return {
      segment: `${from.name} → ${to.name}`,
      meta: `已行 ${Math.round(traveledKm)} km · 剩余 ${Math.round(remainKm)} km · 本段 ${segPct}%${gpsNote}`,
      modeLabel: shortModeLabel(mode),
      isSchedule: mode.includes('时刻表') || mode.includes('模拟'),
    };
  }

  function updateUi(now, progress, mode) {
    currentProgress = progress;
    const pct = Math.round(progress * 100);
    els.clock.textContent = formatClock(now);
    els.mode.innerHTML = isCompact
      ? `定位 <strong>${shortModeLabel(mode)}</strong>`
      : `定位模式：<strong>${mode}</strong>`;
    els.progressChip.innerHTML = isCompact
      ? `进度 <strong>${pct}%</strong>`
      : `全程进度：<strong>${pct}%</strong>`;
    if (els.bottomProgress) els.bottomProgress.textContent = `${pct}%`;
    els.progressBar.style.width = `${pct}%`;

    const { spot, reason } = getUpcomingSpot(now, progress);
    const timeLabel = spot.at ? getSpotTimeLabel(spot) : spot.timeLabel;
    if (progress <= 0 && now < departure) {
      els.nextTitle.textContent = '发车后首站';
    } else {
      els.nextTitle.textContent = progress >= 1 ? '已到达' : '即将到达';
    }
    els.nextName.textContent = spot.name;
    const shortMeta = `${timeLabel ? `计划 ${timeLabel} · ` : ''}${reason}`;
    els.nextMeta.textContent = isCompact || !spot.intro ? shortMeta : `${shortMeta} · ${spot.intro}`;

    const loc = getCurrentLocationInfo(progress, mode);
    if (els.locationSegment) els.locationSegment.textContent = loc.segment;
    if (els.locationMeta) els.locationMeta.textContent = loc.meta;
    if (els.locationMode) {
      els.locationMode.textContent = loc.modeLabel;
      els.locationMode.classList.toggle('is-schedule', loc.isSchedule);
    }
  }

  function computeBounds() {
    const points = [];
    getRailwayCoords().forEach(([lng, lat]) => points.push({ lng, lat }));
    data.stations.forEach((s) => points.push(s));
    data.scenicSpots.forEach((s) => points.push(s));

    let minLng = Infinity;
    let maxLng = -Infinity;
    let minLat = Infinity;
    let maxLat = -Infinity;
    points.forEach(({ lng, lat }) => {
      minLng = Math.min(minLng, lng);
      maxLng = Math.max(maxLng, lng);
      minLat = Math.min(minLat, lat);
      maxLat = Math.max(maxLat, lat);
    });

    const padLng = (maxLng - minLng) * 0.06 || 0.5;
    const padLat = (maxLat - minLat) * 0.08 || 0.5;
    return {
      minLng: minLng - padLng,
      maxLng: maxLng + padLng,
      minLat: minLat - padLat,
      maxLat: maxLat + padLat,
    };
  }

  function createProjector(bounds) {
    const width = 1000;
    const height = (1000 * (bounds.maxLat - bounds.minLat)) / (bounds.maxLng - bounds.minLng);
    return {
      width,
      height,
      project(lng, lat) {
        const x = ((lng - bounds.minLng) / (bounds.maxLng - bounds.minLng)) * width;
        const y = (1 - (lat - bounds.minLat) / (bounds.maxLat - bounds.minLat)) * height;
        return { x, y };
      },
    };
  }

  function setViewBox(next) {
    viewBox = next;
    svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
    updateMapPopupPosition();
  }

  function formatStationSchedule(station) {
    return scheduleApi.formatStationSchedule(station, shifted);
  }

  function ensureMapPopup() {
    if (mapPopupEl) return;
    const shell = document.getElementById('map-shell');
    mapPopupEl = document.createElement('div');
    mapPopupEl.className = 'map-popup';
    mapPopupEl.hidden = true;
    mapPopupEl.innerHTML = `
      <button type="button" class="map-popup__close" aria-label="关闭">×</button>
      <div class="map-popup__title"></div>
      <div class="map-popup__subtitle"></div>
      <div class="map-popup__detail"></div>
      <div class="map-popup__actions"></div>
      <div class="map-popup__arrow" aria-hidden="true"></div>
    `;
    shell.appendChild(mapPopupEl);
    mapPopupEl.querySelector('.map-popup__close').addEventListener('click', (event) => {
      event.stopPropagation();
      closeMapPopup();
    });
    mapPopupEl.addEventListener('click', (event) => event.stopPropagation());
  }

  function svgPointToScreen(svgX, svgY) {
    const rect = svg.getBoundingClientRect();
    const relX = (svgX - viewBox.x) / viewBox.w;
    const relY = (svgY - viewBox.y) / viewBox.h;
    return {
      x: rect.left + relX * rect.width,
      y: rect.top + relY * rect.height,
    };
  }

  function updateMapPopupPosition() {
    if (!mapPopupEl || mapPopupEl.hidden || !mapPopupAnchor) return;
    const { svgX, svgY } = mapPopupAnchor;
    const { x, y } = svgPointToScreen(svgX, svgY);
    const shell = document.getElementById('map-shell');
    const shellRect = shell.getBoundingClientRect();
    mapPopupEl.style.left = `${x - shellRect.left}px`;
    mapPopupEl.style.top = `${y - shellRect.top}px`;
  }

  function openMapPopup({ svgX, svgY, title, subtitle, detail, kind = 'fixed', station = null }) {
    ensureMapPopup();
    mapPopupAnchor = { svgX, svgY, kind };
    mapPopupEl.querySelector('.map-popup__title').textContent = title;
    mapPopupEl.querySelector('.map-popup__subtitle').textContent = subtitle || '';
    mapPopupEl.querySelector('.map-popup__detail').textContent = detail || '';
    const actionsEl = mapPopupEl.querySelector('.map-popup__actions');
    if (actionsEl) {
      actionsEl.innerHTML = station?.type === 'stop'
        ? `<button type="button" class="map-popup__calibrate" data-station-calibrate="${station.name}">我在 ${station.name} 站</button>`
        : '';
      const calibrateBtn = actionsEl.querySelector('[data-station-calibrate]');
      calibrateBtn?.addEventListener('click', (event) => {
        event.stopPropagation();
        closeMapPopup();
        calibrationUi?.openConfirmForStation(station);
      });
    }
    mapPopupEl.hidden = false;
    updateMapPopupPosition();
  }

  function closeMapPopup() {
    if (mapPopupEl) mapPopupEl.hidden = true;
    mapPopupAnchor = null;
  }

  function bindMarkerClick(node, handler) {
    node.addEventListener('click', (event) => {
      event.stopPropagation();
      if (suppressMapClick) {
        suppressMapClick = false;
        return;
      }
      handler();
    });
  }

  function cloneViewBox(v) {
    return { x: v.x, y: v.y, w: v.w, h: v.h };
  }

  function getOverlayInsets() {
    const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--top-overlay')) || 72;
    const bottom = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bottom-overlay')) || 168;
    const shell = document.getElementById('map-shell');
    const rect = shell?.getBoundingClientRect() || { width: window.innerWidth, height: window.innerHeight };
    return { top, bottom, width: rect.width, height: rect.height };
  }

  function centerOnPoint(point, scale = 0.45) {
    if (!projectFn || !point) return;
    const { x, y } = projectFn.project(point.lng, point.lat);
    const insets = getOverlayInsets();
    const visibleRatio = Math.max(0.35, (insets.height - insets.top - insets.bottom) / insets.height);
    const w = baseViewBox.w * scale;
    const h = Math.max(w / (insets.width / (insets.height * visibleRatio)), baseViewBox.h * scale * 0.75);
    const yShift = ((insets.bottom - insets.top) / insets.height) * h * 0.22;
    setViewBox({ x: x - w / 2, y: y - h / 2 + yShift, w, h });
  }

  function fitRouteView(focusPoint) {
    if (!projectFn || !baseViewBox) return;
    updateOverlayMetrics();
    const insets = getOverlayInsets();
    const visibleH = Math.max(120, insets.height - insets.top - insets.bottom);
    const visibleW = Math.max(200, insets.width);
    const pad = isCompact ? 1.12 : 1.06;
    let w = baseViewBox.w * pad;
    let h = baseViewBox.h * pad;
    const visibleAspect = visibleW / visibleH;
    const routeAspect = w / h;
    if (routeAspect > visibleAspect) {
      h = w / visibleAspect;
    } else {
      w = h * visibleAspect;
    }

    let cx;
    let cy;
    if (focusPoint && projectFn) {
      const p = projectFn.project(focusPoint.lng, focusPoint.lat);
      cx = p.x;
      cy = p.y;
    } else {
      cx = baseViewBox.x + baseViewBox.w / 2;
      cy = baseViewBox.y + baseViewBox.h / 2;
    }
    const yShift = ((insets.bottom - insets.top) / insets.height) * h * 0.18;
    setViewBox({ x: cx - w / 2, y: cy - h / 2 + yShift, w, h });
  }

  function scheduleFitRouteView(focusPoint) {
    fitRouteView(focusPoint);
    requestAnimationFrame(() => fitRouteView(focusPoint));
    setTimeout(() => fitRouteView(focusPoint), 120);
  }

  function svgEl(name, attrs, text) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', name);
    Object.entries(attrs || {}).forEach(([k, v]) => el.setAttribute(k, v));
    if (text != null) el.textContent = text;
    return el;
  }

  function getSpotMarkerMinDist() {
    const markerRadius = isCompact ? 5.5 : 6.5;
    const visualDiameter = (markerRadius + 1.5) * 2;
    return visualDiameter * 2;
  }

  const OFFLINE_SPOT_CLUSTERS = [
    { ids: [4, 5, 6], angles: { 4: 210, 5: 330, 6: 90 } },
  ];

  function spreadDisplayPositions(items, minDist) {
    const nodes = items.map((item) => {
      const { x, y } = projectFn.project(item.lng, item.lat);
      return { item, x, y };
    });

    const minDistSq = minDist * minDist;
    for (let pass = 0; pass < 16; pass += 1) {
      for (let i = 0; i < nodes.length; i += 1) {
        for (let j = i + 1; j < nodes.length; j += 1) {
          const a = nodes[i];
          const b = nodes[j];
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          const distSq = dx * dx + dy * dy;
          if (distSq >= minDistSq) continue;

          let dist = Math.sqrt(distSq);
          if (dist < 0.001) {
            const order = (a.item.id || 0) - (b.item.id || 0);
            dx = order <= 0 ? -1 : 1;
            dy = -0.35;
            dist = 1;
          }
          const overlap = (minDist - dist) / 2;
          const nx = dx / dist;
          const ny = dy / dist;
          a.x -= nx * overlap;
          a.y -= ny * overlap;
          b.x += nx * overlap;
          b.y += ny * overlap;
        }
      }
    }

    return new Map(nodes.map((node) => [node.item.id, { x: node.x, y: node.y }]));
  }

  function applyOfflineSpotClusters(positions) {
    OFFLINE_SPOT_CLUSTERS.forEach(({ ids, angles }) => {
      const cluster = data.scenicSpots.filter((spot) => ids.includes(spot.id));
      if (cluster.length !== ids.length) return;

      const centroid = cluster.reduce(
        (acc, spot) => {
          const point = projectFn.project(spot.lng, spot.lat);
          acc.x += point.x;
          acc.y += point.y;
          return acc;
        },
        { x: 0, y: 0 }
      );
      centroid.x /= cluster.length;
      centroid.y /= cluster.length;

      const radius = isCompact ? 26 : 30;
      cluster.forEach((spot) => {
        const rad = (angles[spot.id] * Math.PI) / 180;
        positions.set(spot.id, {
          x: centroid.x + Math.cos(rad) * radius,
          y: centroid.y + Math.sin(rad) * radius,
        });
      });
    });
  }

  function computeSpotDisplayPositions() {
    const clusteredIds = new Set(OFFLINE_SPOT_CLUSTERS.flatMap((cluster) => cluster.ids));
    const regularSpots = data.scenicSpots.filter((spot) => !clusteredIds.has(spot.id));
    const positions = spreadDisplayPositions(regularSpots, getSpotMarkerMinDist());

    data.scenicSpots.forEach((spot) => {
      if (!positions.has(spot.id)) {
        const point = projectFn.project(spot.lng, spot.lat);
        positions.set(spot.id, { x: point.x, y: point.y });
      }
    });

    applyOfflineSpotClusters(positions);
    return positions;
  }

  function renderMap() {
    const bounds = computeBounds();
    projectFn = createProjector(bounds);
    baseViewBox = { x: 0, y: 0, w: projectFn.width, h: projectFn.height };
    setViewBox(cloneViewBox(baseViewBox));

    svg.innerHTML = '';
    viewport = svgEl('g', { id: 'viewport' });

    const defs = svgEl('defs');
    defs.appendChild(svgEl('filter', { id: 'glow', x: '-50%', y: '-50%', width: '200%', height: '200%' }, null));
    const blur = svgEl('feGaussianBlur', { stdDeviation: '2.5', result: 'coloredBlur' });
    const merge = svgEl('feMerge');
    merge.appendChild(svgEl('feMergeNode', { in: 'coloredBlur' }));
    merge.appendChild(svgEl('feMergeNode', { in: 'SourceGraphic' }));
    defs.firstChild.appendChild(blur);
    defs.firstChild.appendChild(merge);
    svg.appendChild(defs);

    const grid = svgEl('g', { opacity: '0.12' });
    for (let i = 0; i <= 10; i += 1) {
      const x = (projectFn.width / 10) * i;
      grid.appendChild(svgEl('line', {
        x1: x, y1: 0, x2: x, y2: projectFn.height,
        stroke: '#64748b', 'stroke-width': '0.6',
      }));
    }
    for (let i = 0; i <= 8; i += 1) {
      const y = (projectFn.height / 8) * i;
      grid.appendChild(svgEl('line', {
        x1: 0, y1: y, x2: projectFn.width, y2: y,
        stroke: '#64748b', 'stroke-width': '0.6',
      }));
    }
    viewport.appendChild(grid);

    const railPoints = getRailwayCoords()
      .map(([lng, lat]) => projectFn.project(lng, lat))
      .map(({ x, y }) => `${x},${y}`)
      .join(' ');
    railLayerEl = svgEl('g', { id: 'rail-layer' });
    railLayerEl.appendChild(svgEl('polyline', {
      points: railPoints,
      fill: 'none',
      stroke: '#38bdf8',
      'stroke-width': isCompact ? '2.2' : '2.8',
      'stroke-linecap': 'round',
      'stroke-linejoin': 'round',
      opacity: '0.9',
    }));
    viewport.appendChild(railLayerEl);

    const spotPositions = computeSpotDisplayPositions();
    spotLayerEl = svgEl('g', { id: 'spot-layer' });

    data.scenicSpots.forEach((spot) => {
      const { x, y } = spotPositions.get(spot.id);
      const g = svgEl('g', { class: 'spot-node', 'data-name': spot.name });
      if (isCompact) {
        g.appendChild(svgEl('circle', {
          cx: x, cy: y, r: 14, fill: 'transparent',
        }));
      }
      g.appendChild(svgEl('circle', {
        cx: x, cy: y, r: isCompact ? 5.5 : 6.5,
        fill: '#f97316', stroke: '#fff', 'stroke-width': '1.5',
        'pointer-events': 'none',
      }));
      g.appendChild(svgEl('text', {
        x, y, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        fill: '#fff', 'font-size': isCompact ? '6' : '7', 'font-weight': '700',
        'pointer-events': 'none',
      }, String(spot.id)));
      const showSpot = () => {
        openMapPopup({
          svgX: x,
          svgY: y,
          title: spot.name,
          subtitle: getSpotTimeLabel(spot),
          detail: spot.intro,
        });
      };
      bindMarkerClick(g, showSpot);
      spotLayerEl.appendChild(g);
    });
    viewport.appendChild(spotLayerEl);

    stationLayerEl = svgEl('g', { id: 'station-layer' });
    data.stations.forEach((station) => {
      const { x, y } = projectFn.project(station.lng, station.lat);
      const g = svgEl('g', { class: 'station-node' });
      if (isCompact) {
        g.appendChild(svgEl('circle', {
          cx: x, cy: y, r: 12, fill: 'transparent',
        }));
      }
      g.appendChild(svgEl('circle', {
        cx: x, cy: y, r: isCompact ? 4.5 : 5.5,
        fill: '#facc15', stroke: '#fff', 'stroke-width': '1.5',
        'pointer-events': 'none',
      }));
      if (!isCompact) {
        g.appendChild(svgEl('text', {
          x, y: y + 11, 'text-anchor': 'middle',
          fill: '#fef9c3', 'font-size': '8', 'font-weight': '600',
        }, station.name));
      }
      bindMarkerClick(g, () => {
        openMapPopup({
          svgX: x,
          svgY: y,
          title: station.name,
          subtitle: formatStationSchedule(station),
          detail: station.intro,
          station,
        });
      });
      stationLayerEl.appendChild(g);
    });
    viewport.appendChild(stationLayerEl);

    gpsEl = svgEl('g', { id: 'gps-marker', display: 'none' });
    gpsEl.appendChild(svgEl('circle', {
      cx: 0, cy: 0, r: 5, fill: '#60a5fa', stroke: '#fff', 'stroke-width': '1.5',
    }));
    viewport.appendChild(gpsEl);

    trainEl = svgEl('g', { id: 'train-marker', filter: 'url(#glow)' });
    if (isCompact) {
      trainEl.appendChild(svgEl('circle', {
        cx: 0, cy: 0, r: 14, fill: 'transparent',
      }));
    }
    trainEl.appendChild(svgEl('circle', {
      cx: 0, cy: 0, r: isCompact ? 6 : 7,
      fill: '#22c55e', stroke: '#fff', 'stroke-width': '2',
    }));
    trainEl.appendChild(svgEl('circle', {
      cx: 0, cy: 0, r: isCompact ? 10 : 12,
      fill: 'none', stroke: '#22c55e', 'stroke-width': '1.2', opacity: '0.45',
    }));
    if (!isCompact) {
      trainEl.appendChild(svgEl('text', {
        x: 0, y: 16, 'text-anchor': 'middle',
        fill: '#dcfce7', 'font-size': '8', 'font-weight': '700',
      }, '列车位置'));
    }
    bindMarkerClick(trainEl, () => {
      const loc = getCurrentLocationInfo(currentProgress, lastMode);
      const { x, y } = projectFn.project(lastTrainPoint.lng, lastTrainPoint.lat);
      openMapPopup({
        svgX: x,
        svgY: y,
        kind: 'train',
        title: '列车估算位置',
        subtitle: loc.segment,
        detail: `${loc.meta} · 定位：${lastMode}`,
      });
    });
    viewport.appendChild(trainEl);
    applyLayerVisibility();

    svg.appendChild(viewport);
    bindPanZoom();
  }

  function applyLayerVisibility() {
    if (railLayerEl) {
      railLayerEl.setAttribute('display', layerVisibility.rail ? 'inline' : 'none');
    }
    if (spotLayerEl) {
      spotLayerEl.setAttribute('display', layerVisibility.spot ? 'inline' : 'none');
    }
    if (stationLayerEl) {
      stationLayerEl.setAttribute('display', layerVisibility.station ? 'inline' : 'none');
    }
    if (trainEl) {
      trainEl.setAttribute('display', layerVisibility.train ? 'inline' : 'none');
    }
    if (gpsEl) {
      const gpsActive = gpsAvailable && lastGps && Date.now() - lastGpsAt <= 120000;
      gpsEl.setAttribute('display', layerVisibility.gps && gpsActive ? 'inline' : 'none');
    }
    if (!layerVisibility.train && mapPopupAnchor?.kind === 'train') closeMapPopup();
    els.legend?.querySelectorAll('[data-layer]').forEach((btn) => {
      const layer = btn.dataset.layer;
      if (!layer) return;
      btn.setAttribute('aria-pressed', layerVisibility[layer] ? 'true' : 'false');
    });
  }

  function bindLayerToggles() {
    if (!els.legend) return;
    els.legend.querySelectorAll('[data-layer]').forEach((btn) => {
      btn.addEventListener('click', (event) => {
        event.stopPropagation();
        const layer = btn.dataset.layer;
        if (!layer) return;
        layerVisibility = scheduleApi.setLayerVisible(layer, !layerVisibility[layer]);
        applyLayerVisibility();
        if (mapPopupEl && !mapPopupEl.hidden) closeMapPopup();
      });
    });
  }

  function moveMarkers(point, gps) {
    if (!projectFn || !trainEl) return;
    const { x, y } = projectFn.project(point.lng, point.lat);
    trainEl.setAttribute('transform', `translate(${x}, ${y})`);

    if (mapPopupAnchor?.kind === 'train') {
      mapPopupAnchor.svgX = x;
      mapPopupAnchor.svgY = y;
      updateMapPopupPosition();
    }

    if (gpsEl && gps && gpsAvailable && Date.now() - lastGpsAt <= 120000) {
      const gp = projectFn.project(gps.lng, gps.lat);
      gpsEl.setAttribute('transform', `translate(${gp.x}, ${gp.y})`);
      gpsEl.setAttribute('display', layerVisibility.gps ? 'inline' : 'none');
    } else if (gpsEl) {
      gpsEl.setAttribute('display', 'none');
    }
  }

  function tick(gps) {
    const now = getNow();
    if (gps) {
      lastGps = gps;
      gpsAvailable = true;
      lastGpsAt = Date.now();
    }
    const { progress, mode } = resolveProgress(now, gps);
    lastMode = mode;
    const point = pointAtProgress(progress);
    lastTrainPoint = point;
    moveMarkers(point, gpsAvailable ? lastGps : null);
    updateUi(now, progress, mode);
  }

  function bindPanZoom() {
    let dragging = false;
    let last = null;
    let pinch = null;
    let dragMoved = false;

    const clientToSvg = (clientX, clientY) => {
      const rect = svg.getBoundingClientRect();
      const relX = (clientX - rect.left) / rect.width;
      const relY = (clientY - rect.top) / rect.height;
      return {
        x: viewBox.x + relX * viewBox.w,
        y: viewBox.y + relY * viewBox.h,
      };
    };

    const onWheel = (event) => {
      event.preventDefault();
      const focus = clientToSvg(event.clientX, event.clientY);
      const factor = event.deltaY > 0 ? 1.12 : 0.88;
      const nextW = Math.max(baseViewBox.w * 0.12, Math.min(baseViewBox.w * 3, viewBox.w * factor));
      const nextH = Math.max(baseViewBox.h * 0.12, Math.min(baseViewBox.h * 3, viewBox.h * factor));
      const ratioX = (focus.x - viewBox.x) / viewBox.w;
      const ratioY = (focus.y - viewBox.y) / viewBox.h;
      setViewBox({
        x: focus.x - nextW * ratioX,
        y: focus.y - nextH * ratioY,
        w: nextW,
        h: nextH,
      });
    };

    const onPointerDown = (event) => {
      if (event.pointerType === 'touch' && event.isPrimary === false) return;
      const target = event.target;
      const onMarker = target.closest?.('.spot-node, .station-node, #train-marker, .map-popup');
      if (!onMarker) closeMapPopup();
      dragging = true;
      dragMoved = false;
      last = { x: event.clientX, y: event.clientY };
      svg.classList.add('is-dragging');
      if (svg.setPointerCapture) svg.setPointerCapture(event.pointerId);
    };

    const onPointerMove = (event) => {
      if (pinch) {
        const [a, b] = pinch.points;
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        const focus = clientToSvg(mid.x, mid.y);
        const scale = dist / pinch.dist;
        const nextW = Math.max(baseViewBox.w * 0.12, Math.min(baseViewBox.w * 3, pinch.view.w / scale));
        const nextH = Math.max(baseViewBox.h * 0.12, Math.min(baseViewBox.h * 3, pinch.view.h / scale));
        const ratioX = (focus.x - viewBox.x) / viewBox.w;
        const ratioY = (focus.y - viewBox.y) / viewBox.h;
        setViewBox({
          x: focus.x - nextW * ratioX,
          y: focus.y - nextH * ratioY,
          w: nextW,
          h: nextH,
        });
        return;
      }

      if (!dragging || !last) return;
      const dxPx = event.clientX - last.x;
      const dyPx = event.clientY - last.y;
      if (Math.abs(dxPx) > 4 || Math.abs(dyPx) > 4) dragMoved = true;
      const rect = svg.getBoundingClientRect();
      const dx = (dxPx / rect.width) * viewBox.w;
      const dy = (dyPx / rect.height) * viewBox.h;
      setViewBox({
        x: viewBox.x - dx,
        y: viewBox.y - dy,
        w: viewBox.w,
        h: viewBox.h,
      });
      last = { x: event.clientX, y: event.clientY };
    };

    const onPointerUp = (event) => {
      suppressMapClick = dragMoved;
      dragging = false;
      last = null;
      pinch = null;
      svg.classList.remove('is-dragging');
      try { if (svg.releasePointerCapture) svg.releasePointerCapture(event.pointerId); } catch (_) { /* noop */ }
    };

    svg.addEventListener('wheel', onWheel, { passive: false });
    svg.addEventListener('pointerdown', onPointerDown);
    svg.addEventListener('pointermove', onPointerMove);
    svg.addEventListener('pointerup', onPointerUp);
    svg.addEventListener('pointercancel', onPointerUp);

    svg.addEventListener('touchstart', (event) => {
      if (event.touches.length === 2) {
        event.preventDefault();
        const [a, b] = [...event.touches];
        pinch = {
          dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
          points: [{ x: a.clientX, y: a.clientY }, { x: b.clientX, y: b.clientY }],
          view: cloneViewBox(viewBox),
        };
        dragging = false;
      }
    }, { passive: false });

    svg.addEventListener('touchmove', (event) => {
      if (event.touches.length === 2 && pinch) {
        event.preventDefault();
        const [a, b] = [...event.touches];
        pinch.points = [{ x: a.clientX, y: a.clientY }, { x: b.clientX, y: b.clientY }];
      }
    }, { passive: false });

    svg.addEventListener('touchend', () => {
      if (pinch) pinch = null;
    });

    document.body.addEventListener('touchmove', (event) => {
      if (event.target === svg || svg.contains(event.target)) return;
      if (event.target.closest('.bottom-panel')) return;
    }, { passive: true });
  }

  function bindLegendToggle() {
    if (!els.legendToggle || !els.legend) return;
    els.legendToggle.addEventListener('click', () => {
      const open = els.legend.classList.toggle('is-open');
      els.legendToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', (event) => {
      if (!els.legend.classList.contains('is-open')) return;
      if (els.legend.contains(event.target) || els.legendToggle.contains(event.target)) return;
      els.legend.classList.remove('is-open');
      els.legendToggle.setAttribute('aria-expanded', 'false');
    });
    document.addEventListener('click', (event) => {
      if (!mapPopupEl || mapPopupEl.hidden) return;
      if (mapPopupEl.contains(event.target)) return;
      if (event.target.closest?.('.spot-node, .station-node, #train-marker')) return;
      closeMapPopup();
    });
  }

  function bindLocateButton() {
    if (!els.locateBtn) return;
    els.locateBtn.addEventListener('click', () => centerOnPoint(lastTrainPoint, 0.42));
  }

  function updateOverlayMetrics() {
    const topBar = document.querySelector('.top-bar');
    const bottomPanel = document.querySelector('.bottom-panel');
    const top = Math.ceil(topBar?.getBoundingClientRect().height || 72) + 16;
    const bottom = Math.ceil(bottomPanel?.getBoundingClientRect().height || 168) + 12;
    document.documentElement.style.setProperty('--top-overlay', `${top}px`);
    document.documentElement.style.setProperty('--bottom-overlay', `${bottom}px`);
  }

  function startGeolocation() {
    const TICK_MS = 1000;
    setInterval(() => tick(null), TICK_MS);
    tick(null);

    if (!navigator.geolocation) return;

    navigator.geolocation.watchPosition(
      (pos) => {
        tick({
          lng: pos.coords.longitude,
          lat: pos.coords.latitude,
          accuracy: pos.coords.accuracy,
          timestamp: pos.timestamp,
        });
      },
      () => {
        gpsAvailable = false;
        els.mode.classList.add('warn');
        tick(null);
      },
      { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
    );
  }

  function boot() {
    isCompact = isMobileLayout();
    svg = document.getElementById('route-svg');
    buildRailwayMetrics();
    buildStationDistances();
    renderMap();
    bindLegendToggle();
    bindLayerToggles();
    bindLocateButton();
    scheduleApi.updateDepartBadge(departure);
    scheduleApi.bindDepartureEditor({
      data,
      config,
      getSchedule: () => scheduleState,
      onApply: applySchedule,
    });
    calibrationUi = scheduleApi.bindStationCalibration({
      data,
      shifted,
      getNow,
      getCalibration: () => calibration,
      onApply: applyCalibration,
      onClear: clearCalibrationState,
      elements: {
        toggle: document.getElementById('calibrate-toggle'),
        panel: document.getElementById('calibrate-panel'),
        list: document.getElementById('calibrate-stations'),
        status: document.getElementById('calibrate-status'),
        clearBtn: document.getElementById('calibrate-clear'),
        dialog: document.getElementById('calibrate-dialog'),
        dialogText: document.getElementById('calibrate-dialog-text'),
        dialogConfirm: document.getElementById('calibrate-confirm'),
        dialogCancel: document.getElementById('calibrate-cancel'),
        toast: document.getElementById('toast'),
      },
    });
    updateOverlayMetrics();

    window.addEventListener('resize', () => {
      const nextCompact = isMobileLayout();
      if (nextCompact !== isCompact) {
        location.reload();
        return;
      }
      updateOverlayMetrics();
      scheduleFitRouteView(lastTrainPoint);
      updateMapPopupPosition();
    });

    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        updateOverlayMetrics();
        scheduleFitRouteView(lastTrainPoint);
        updateMapPopupPosition();
      }, 180);
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        updateOverlayMetrics();
        updateMapPopupPosition();
      });
    }

    if (typeof ResizeObserver !== 'undefined') {
      const observer = new ResizeObserver(updateOverlayMetrics);
      const topBar = document.querySelector('.top-bar');
      const bottomPanel = document.querySelector('.bottom-panel');
      if (topBar) observer.observe(topBar);
      if (bottomPanel) observer.observe(bottomPanel);
    }

    startGeolocation();
    tick(null);
    fitRouteView(lastTrainPoint);
  }

  boot();
})();

  </script>
</body>
</html>
